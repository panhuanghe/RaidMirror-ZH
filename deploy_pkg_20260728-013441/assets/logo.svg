<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7b68ee"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="lensClip">
      <circle cx="36" cy="40" r="26"/>
    </clipPath>
  </defs>

  <!-- Background plate -->
  <rect width="320" height="80" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1"/>

  <!-- Lens icon area -->
  <g transform="translate(10, 4)">
    <!-- Outer ring -->
    <circle cx="36" cy="40" r="30" fill="none" stroke="#30363d" stroke-width="2"/>
    <!-- Lens body - hexagonal tech feel -->
    <circle cx="36" cy="40" r="26" fill="#0d1117" stroke="url(#lensGrad)" stroke-width="2.5"/>
    <!-- Inner lens glass -->
    <circle cx="36" cy="40" r="20" fill="#0a0e14" stroke="#21262d" stroke-width="1"/>
    <!-- Lens reflection / glare -->
    <ellipse cx="29" cy="33" rx="8" ry="5" fill="#00d4ff" opacity="0.15" transform="rotate(-30 29 33)"/>
    <ellipse cx="42" cy="46" rx="5" ry="3" fill="#7b68ee" opacity="0.1" transform="rotate(20 42 46)"/>
    <!-- Crosshair / targeting reticle -->
    <line x1="36" y1="18" x2="36" y2="24" stroke="#00d4ff" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
    <line x1="36" y1="56" x2="36" y2="62" stroke="#00d4ff" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
    <line x1="14" y1="40" x2="20" y2="40" stroke="#00d4ff" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
    <line x1="52" y1="40" x2="58" y2="40" stroke="#00d4ff" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>
    <!-- Center dot -->
    <circle cx="36" cy="40" r="2.5" fill="#00d4ff" filter="url(#strongGlow)"/>
    <!-- Data rings -->
    <circle cx="36" cy="40" r="14" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 3"/>
    <circle cx="36" cy="40" r="10" fill="none" stroke="#7b68ee" stroke-width="0.5" opacity="0.25" stroke-dasharray="2 4"/>
  </g>

  <!-- Text: 战镜 -->
  <text x="82" y="52" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="4">战镜</text>

  <!-- English subtitle -->
  <text x="170" y="52" font-family="'SF Pro Display','-apple-system',sans-serif" font-size="18" font-weight="600" fill="#8b949e" letter-spacing="1">RaidMirror</text>

  <!-- Accent line -->
  <line x1="82" y1="62" x2="168" y2="62" stroke="url(#lensGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Badge -->
  <rect x="256" y="26" width="54" height="22" rx="11" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="283" y="42" font-family="'SF Pro Display',sans-serif" font-size="11" font-weight="500" fill="#8b949e" text-anchor="middle" letter-spacing="0.5">v2.0 ZH</text>
</svg>
